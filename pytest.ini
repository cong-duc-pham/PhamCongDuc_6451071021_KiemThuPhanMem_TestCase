[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=reports/report.html --self-contained-html --alluredir=reports/allure-results
markers =
    smoke: Smoke test cases for critical paths
    regression: Regression test cases
    login: Test cases related to Login module
    forgot_password: Test cases for Forgot Password module
    security: Test cases for security & validation checks
    ui: UI and responsiveness checks
